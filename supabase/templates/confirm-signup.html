<!-- Supabase › Authentication › Emails › Confirm signup
     Objet : Confirmez votre compte PICTI -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1a1a1a;">
  <h1 style="color: #eb0c0c; font-size: 28px; letter-spacing: 4px; margin: 0 0 24px;">PICTI</h1>
  <p style="font-size: 16px; line-height: 1.5;">Bienvenue sur PICTI !</p>
  <p style="font-size: 16px; line-height: 1.5;">
    Pour activer votre compte ({{ .Email }}), confirmez votre adresse en touchant le bouton ci-dessous.
  </p>
  <p style="margin: 32px 0; text-align: center;">
    <a href="{{ .ConfirmationURL }}" style="background: #eb0c0c; color: #ffffff; padding: 14px 28px; border-radius: 999px; text-decoration: none; font-size: 16px; font-weight: bold;">Confirmer mon adresse</a>
  </p>
  <p style="font-size: 14px; line-height: 1.5; color: #666666;">
    Si vous n'avez pas créé de compte PICTI, ignorez cet e-mail.
  </p>
</div>
